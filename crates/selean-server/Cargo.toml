[package]
name = "selean-server"
version = "0.1.0"
description = "HTTP server for the Selean design platform (Claude API proxy, file upload, SSE)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "selean-server"
path = "src/main.rs"

[dependencies]
selean-llm = { path = "../selean-llm" }
selean-common = { path = "../selean-common" }
selean-pptx = { path = "../selean-pptx" }
selean-idml = { path = "../selean-idml" }
selean-figma = { path = "../selean-figma" }
selean-engine = { path = "../selean-engine" }
selean-collab = { path = "../selean-collab" }
selean-db = { path = "../selean-db" }
axum = { workspace = true, features = ["multipart", "ws"] }
sqlx.workspace = true
tokio.workspace = true
reqwest.workspace = true
tower-http.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
chrono.workspace = true
argon2.workspace = true
jsonwebtoken.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
tokio-stream = "0.1"
futures-util = "0.3"

[dev-dependencies]
serde_json.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"

[lints]
workspace = true
