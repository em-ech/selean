[package]
name = "selean-server"
version = "0.1.0"
description = "HTTP server for the Selean design platform (Claude API proxy, file upload, SSE)"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "selean-server"
path = "src/main.rs"

[dependencies]
selean-llm = { path = "../selean-llm" }
selean-common = { path = "../selean-common" }
selean-pptx = { path = "../selean-pptx" }
selean-engine = { path = "../selean-engine" }
axum = { workspace = true, features = ["multipart"] }
tokio.workspace = true
reqwest.workspace = true
tower-http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
tokio-stream = "0.1"
futures-util = "0.3"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tower = "0.5"

[lints]
workspace = true
