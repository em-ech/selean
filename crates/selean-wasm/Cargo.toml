[package]
name = "selean-wasm"
version = "0.1.0"
description = "WASM binding layer for the Selean design platform"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
selean-engine = { path = "../selean-engine" }
selean-common = { path = "../selean-common" }
selean-llm = { path = "../selean-llm" }
selean-codegen = { path = "../selean-codegen" }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
serde-wasm-bindgen = "0.6"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "console",
] }
console_error_panic_hook = "0.1"
wgpu = { workspace = true, features = ["webgpu"] }
uuid = { workspace = true, features = ["js"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
