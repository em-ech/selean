[package]
name = "selean-engine"
version = "0.1.0"
description = "GPU-accelerated 2D rendering engine for the Selean design platform"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
selean-common = { path = "../selean-common" }
wgpu.workspace = true
bytemuck.workspace = true
rstar.workspace = true
tracing.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
rustybuzz.workspace = true
ttf-parser.workspace = true
ab_glyph_rasterizer.workspace = true
image.workspace = true
tiny-skia.workspace = true
svgtypes.workspace = true
smallvec = { version = "1", features = ["serde"] }

# The browser build reads the clock from JavaScript (std's clock panics there).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"

[dev-dependencies]
proptest.workspace = true
tracing-subscriber.workspace = true
pollster = "0.4"
criterion.workspace = true
rand.workspace = true
ttf-parser.workspace = true
image.workspace = true

[[bench]]
name = "engine_benchmarks"
harness = false

[lints]
workspace = true
