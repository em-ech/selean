services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: selean
      POSTGRES_PASSWORD: selean
      POSTGRES_DB: selean
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U selean"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-production}"
      DATABASE_URL: "postgres://selean:selean@postgres:5432/selean"
      RUST_LOG: "info,selean_server=debug"
      SELEAN_DATA_DIR: "/app/data/rooms"
      SELEAN_ASSET_DIR: "/app/data/assets"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-}"
      S3_ENDPOINT: "${S3_ENDPOINT:-}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY:-}"
      S3_SECRET_KEY: "${S3_SECRET_KEY:-}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - appdata:/app/data

volumes:
  pgdata:
  miniodata:
  appdata:
