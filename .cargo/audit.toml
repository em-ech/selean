# cargo-audit configuration (read by `cargo audit`, including in CI).
#
# Every ignored advisory needs a reason and a condition for removing it.
# Do not add an entry for a crate that can simply be upgraded.

[advisories]
ignore = [
    # rsa 0.9.x: Marvin attack timing side channel. No fixed release exists.
    # The crate is only in Cargo.lock through sqlx-mysql, which sqlx's macro
    # crate lists for every database; this workspace enables the postgres
    # feature only, so rsa is never compiled (`cargo tree -i rsa` is empty).
    # Remove when sqlx stops locking sqlx-mysql or rsa ships a fix.
    "RUSTSEC-2023-0071",

    # quick-xml < 0.41: denial of service through quadratic duplicate-attribute
    # checks (0194) and unbounded namespace allocation in NsReader (0195).
    # The workspace's own XML parsing (PPTX/IDML import, which reads untrusted
    # uploads) is on quick-xml 0.41. The affected 0.38 copy is pulled in only
    # by rust-s3 0.37.2 / aws-creds 0.39.1, the latest releases, and parses
    # responses from the S3 endpoint the operator configures (S3_BUCKET set).
    # Remove when rust-s3 and aws-creds move to quick-xml >= 0.41.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]
